<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri Foto</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#f4f4f4;padding:15px}

/* TOP BAR */
.topbar{display:flex;gap:10px;margin-bottom:15px;align-items:center}
#search{flex:1;padding:12px;border:1px solid #ccc;border-radius:10px}

/* MENU */
.menu-wrap{position:relative;z-index:99999}
.menu-btn{
  width:50px;height:45px;
  border:none;border-radius:10px;
  background:#333;color:#fff;
  font-size:20px;cursor:pointer;
}
.menu-box{
  position:absolute;
  top:55px;right:0;
  background:white;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
  display:none;
  flex-direction:column;
  overflow:hidden;
  z-index:100001;
}
.menu-box button{
  padding:10px;
  border:none;
  background:white;
  cursor:pointer;
  width:130px;
  text-align:left;
}
.menu-box button:hover{background:#eee}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:15px;
}

/* CARD */
.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  position:relative;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  cursor:pointer;
}

/* TITLE */
.card-title{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:35%;
  background:rgba(0,0,0,.5);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:5px;
  font-weight:bold;
}

/* EDIT ACTIONS */
.card-actions{display:none;}
.edit-mode .card-actions{display:flex;}
.card-actions button{
  flex:1; border:none; padding:8px; cursor:pointer;
}
.delete-btn{background:#e53935;color:white}
.edit-btn{background:#ffb300}

/* MODAL */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:100000;
}
.modal-box{
  background:white;
  padding:20px;
  width:90%;
  max-width:400px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.modal-box h3{font-size:16px;}
.modal-box input[type="text"]{
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:14px;
  width:100%;
}
.modal-box input[type="file"]{font-size:14px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}
.modal-actions button{
  padding:8px 16px;
  border:none;border-radius:8px;cursor:pointer;font-size:14px;
}
.btn-cancel{background:#eee;}
.btn-ok{background:#333;color:white;}

/* VIEWER */
.viewer{
  position:fixed;inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999999;
}
.viewer img{max-width:100%;max-height:100%;}
</style>
</head>

<body>

<div class="topbar">
  <input id="search" placeholder="Cari foto...">
  <div class="menu-wrap">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="menu-box" id="menuBox">
      <button onclick="openModal()">+ Tambah</button>
      <button id="editBtn" onclick="toggleEdit()">Edit Mode</button>
    </div>
  </div>
</div>

<div id="gallery" class="gallery"></div>

<!-- MODAL TAMBAH -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>Tambah Foto</h3>
    <input type="text" id="titleInput" placeholder="Judul foto...">
    <input type="file" id="photoInput" accept="image/*" multiple>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn-ok" onclick="savePhotos()">Simpan</button>
    </div>
  </div>
</div>

<!-- VIEWER -->
<div class="viewer" id="viewer" onclick="closeViewer()">
  <img id="viewerImg">
</div>

<script>
let db;
let editMode = false;
let allData = [];
let searchDebounce = null;

const request = indexedDB.open("PhotoGalleryDB", 1);

request.onupgradeneeded = e => {
  db = e.target.result;
  if (!db.objectStoreNames.contains("photos")) {
    db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
  }
};

request.onsuccess = e => {
  db = e.target.result;
  loadAllData();
};

/* MENU */
function toggleMenu() {
  const m = document.getElementById("menuBox");
  m.style.display = m.style.display === "flex" ? "none" : "flex";
  m.style.flexDirection = "column";
}

/* EDIT MODE */
function toggleEdit() {
  editMode = !editMode;
  const gallery = document.getElementById("gallery");
  const btn = document.getElementById("editBtn");
  gallery.classList.toggle("edit-mode", editMode);
  btn.textContent = editMode ? "Edit Mode •" : "Edit Mode";
  document.getElementById("menuBox").style.display = "none";
}

/* MODAL */
function openModal() {
  document.getElementById("titleInput").value = "";
  document.getElementById("photoInput").value = "";
  document.getElementById("modal").style.display = "flex";
}
function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* SAVE - tanpa OCR */
function savePhotos() {
  const files = [...document.getElementById("photoInput").files];
  const titleRaw = document.getElementById("titleInput").value.trim();

  if (files.length === 0) return alert("Pilih foto dulu.");
  if (files.length > 20) return alert("Maks 20 foto.");

  files.forEach((file, idx) => {
    // Kalau banyak foto, judul dikasih nomor urut otomatis
    const title = files.length === 1
      ? (titleRaw || "Tanpa Judul")
      : (titleRaw ? `${titleRaw} ${idx + 1}` : `Foto ${idx + 1}`);

    const reader = new FileReader();
    reader.onload = e => {
      const tx = db.transaction("photos", "readwrite");
      const obj = { title, image: e.target.result };
      const req = tx.objectStore("photos").add(obj);
      req.onsuccess = () => {
        obj.id = req.result;
        allData.unshift(obj);
        renderItem(obj, true);
      };
    };
    reader.readAsDataURL(file);
  });

  closeModal();
}

/* LOAD ONCE */
function loadAllData() {
  const tx = db.transaction("photos", "readonly");
  tx.objectStore("photos").getAll().onsuccess = e => {
    allData = e.target.result.reverse();
    render(allData);
  };
}

/* SEARCH - debounced */
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    const keyword = e.target.value.toLowerCase();
    document.querySelectorAll(".card").forEach(card => {
      const title = card.getAttribute("data-title").toLowerCase();
      card.style.display = title.includes(keyword) ? "" : "none";
    });
  }, 120);
});

/* RENDER ALL */
function render(data) {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";
  data.forEach(item => renderItem(item, false));
}

/* RENDER SINGLE ITEM */
function renderItem(item, prepend) {
  const gallery = document.getElementById("gallery");
  const card = document.createElement("div");
  card.className = "card";
  card.setAttribute("data-id", item.id);
  card.setAttribute("data-title", item.title);

  card.innerHTML = `
    <div class="card-title">${item.title}</div>
    <img src="${item.image}" onclick="viewImage(${item.id})">
    <div class="card-actions">
      <button class="edit-btn" onclick="editTitle(${item.id})">Edit</button>
      <button class="delete-btn" onclick="deletePhoto(${item.id})">Hapus</button>
    </div>
  `;

  if (prepend) gallery.prepend(card);
  else gallery.appendChild(card);
}

/* EDIT TITLE */
function editTitle(id) {
  const newTitle = prompt("Judul baru:");
  if (!newTitle) return;

  const tx = db.transaction("photos", "readwrite");
  const store = tx.objectStore("photos");
  store.get(id).onsuccess = e => {
    const data = e.target.result;
    data.title = newTitle;
    store.put(data);
    const card = document.querySelector(`[data-id="${id}"]`);
    if (card) {
      card.setAttribute("data-title", newTitle);
      card.querySelector(".card-title").innerText = newTitle;
    }
  };
}

/* DELETE */
function deletePhoto(id) {
  if (!confirm("Hapus foto?")) return;
  const tx = db.transaction("photos", "readwrite");
  tx.objectStore("photos").delete(id);
  tx.oncomplete = () => {
    document.querySelector(`[data-id="${id}"]`)?.remove();
    allData = allData.filter(item => item.id !== id);
  };
}

/* VIEW */
function viewImage(id) {
  const item = allData.find(i => i.id == id);
  if (!item) return;
  document.getElementById("viewerImg").src = item.image;
  document.getElementById("viewer").style.display = "flex";
}
function closeViewer() {
  document.getElementById("viewer").style.display = "none";
}
</script>

</body>
</html>
