<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri Foto</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#f4f4f4;padding:15px}

/* TOP BAR */
.topbar{display:flex;gap:10px;margin-bottom:15px;align-items:center}
#search{flex:1;padding:12px;border:1px solid #ccc;border-radius:10px}

/* MENU */
.menu-wrap{
  position:relative;
  z-index:9999; /* FIX utama biar di atas card */
}

.menu-btn{
  width:50px;height:45px;
  border:none;border-radius:10px;
  background:#333;color:#fff;
  font-size:20px;cursor:pointer;

  position:relative;
  z-index:10000;
}

.menu-box{
  position:absolute;
  top:55px;right:0;

  background:white;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,.2);

  display:none;
  flex-direction:column;
  overflow:hidden;

  z-index:10001; /* paling atas */
}

.menu-box button{
  padding:10px;
  border:none;
  background:white;
  cursor:pointer;
  width:120px;
}

.menu-box button:hover{background:#eee}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  position:relative;
  z-index:1;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  cursor:pointer;
}

/* TITLE OVERLAY 35% ATAS */
.card-title{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:35%;
  background:rgba(0,0,0,.5);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:5px;
  font-weight:bold;
}

/* EDIT AREA */
.card-actions{
  display:flex;
}

.card-actions button{
  flex:1;
  border:none;
  padding:8px;
  cursor:pointer;
}

.delete-btn{background:#e53935;color:white}
.edit-btn{background:#ffb300}

/* MODAL */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:white;
  padding:20px;
  width:90%;
  max-width:400px;
  border-radius:12px;
}

.modal-box input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}

/* VIEWER */
.viewer{
  position:fixed;inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  justify-content:center;
  align-items:center;
}
.viewer img{max-width:100%;max-height:100%}
</style>
</head>

<body>

<div class="topbar">
  <input id="search" placeholder="Cari foto...">

  <div class="menu-wrap">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <div class="menu-box" id="menuBox">
      <button onclick="openModal()">+ Tambah</button>
      <button onclick="toggleEdit()">Edit Mode</button>
    </div>
  </div>
</div>

<div id="gallery" class="gallery"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>Tambah Foto (maks 20)</h3>

    <input type="file" id="photoInput" accept="image/*" multiple>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closeModal()">Cancel</button>
      <button onclick="savePhotos()">OK</button>
    </div>
  </div>
</div>

<!-- VIEWER -->
<div class="viewer" id="viewer" onclick="closeViewer()">
  <img id="viewerImg">
</div>

<script>
let db;
let editMode = false;

const request = indexedDB.open("PhotoGalleryDB",1);

request.onupgradeneeded = e=>{
  db = e.target.result;
  if(!db.objectStoreNames.contains("photos")){
    db.createObjectStore("photos",{keyPath:"id",autoIncrement:true});
  }
};

request.onsuccess = e=>{
  db = e.target.result;
  loadPhotos();
};

/* MENU */
function toggleMenu(){
  const m = document.getElementById("menuBox");
  m.style.display = m.style.display==="flex"?"none":"flex";
  m.style.flexDirection="column";
}

/* EDIT MODE */
function toggleEdit(){
  editMode = !editMode;
  alert("Edit Mode: " + (editMode ? "ON" : "OFF"));
  loadPhotos();
}

/* MODAL */
function openModal(){
  document.getElementById("modal").style.display="flex";
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* OCR TITLE */
async function extractTitle(file){
  const result = await Tesseract.recognize(file,'eng');
  return result.data.text.trim().split("\n")[0] || "Tanpa Judul";
}

/* SAVE MULTI (MAX 20) */
async function savePhotos(){
  const files = [...document.getElementById("photoInput").files];

  if(files.length===0){
    alert("Pilih foto dulu");
    return;
  }

  if(files.length>20){
    alert("Maks 20 foto");
    return;
  }

  for(const file of files){

    const title = await extractTitle(file);

    const reader = new FileReader();

    reader.onload = e=>{
      const tx = db.transaction("photos","readwrite");
      tx.objectStore("photos").add({
        title,
        image:e.target.result
      });
    };

    reader.readAsDataURL(file);
  }

  setTimeout(()=>{
    closeModal();
    loadPhotos();
  },1500);
}

/* LOAD */
function loadPhotos(){
  const gallery = document.getElementById("gallery");
  const keyword = document.getElementById("search").value.toLowerCase();

  gallery.innerHTML="";

  const tx = db.transaction("photos","readonly");
  const store = tx.objectStore("photos");

  store.getAll().onsuccess = e=>{
    const data = e.target.result.reverse();

    data.forEach(item=>{

      if(!item.title.toLowerCase().includes(keyword)) return;

      const card = document.createElement("div");
      card.className="card";

      card.innerHTML=`
        <div class="card-title">${item.title}</div>

        <img src="${item.image}" onclick="viewImage('${item.image}')">

        ${editMode ? `
        <div class="card-actions">
          <button class="edit-btn" onclick="editTitle(${item.id})">Edit</button>
          <button class="delete-btn" onclick="deletePhoto(${item.id})">Hapus</button>
        </div>
        ` : ""}
      `;

      gallery.appendChild(card);
    });
  };
}

/* EDIT TITLE */
function editTitle(id){
  const newTitle = prompt("Judul baru:");
  if(!newTitle) return;

  const tx = db.transaction("photos","readwrite");
  const store = tx.objectStore("photos");

  const req = store.get(id);

  req.onsuccess = e=>{
    const data = e.target.result;
    data.title = newTitle;
    store.put(data);
    loadPhotos();
  };
}

/* DELETE */
function deletePhoto(id){
  if(!confirm("Hapus foto?")) return;
  const tx = db.transaction("photos","readwrite");
  tx.objectStore("photos").delete(id);
  tx.oncomplete = loadPhotos;
}

/* VIEW */
function viewImage(src){
  document.getElementById("viewerImg").src=src;
  document.getElementById("viewer").style.display="flex";
}
function closeViewer(){
  document.getElementById("viewer").style.display="none";
}

document.getElementById("search").addEventListener("input",loadPhotos);
</script>

</body>
</html>
